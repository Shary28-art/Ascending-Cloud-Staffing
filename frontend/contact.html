<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Ascending Cloud Staffing for hiring support, candidate inquiries, and partnership opportunities.">
    <title>Contact | Ascending Cloud Staffing</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <a class="skip-link" href="#mainContent">Skip to main content</a>

    <div id="siteNav"></div>

    <main id="mainContent" class="page">
        <div class="container">
            <div class="page-title">
                <h1>Contact Us</h1>
            </div>

            <div class="content-grid">
                <section class="panel">
                    <h2>Send a message</h2>
                    <p class="muted">Our team will respond within one business day.</p>

                    <form id="contactForm" onsubmit="submitContactForm(event)">
                        <div class="field">
                            <label for="contactName">Name</label>
                            <input id="contactName" type="text" required>
                        </div>

                        <div class="field">
                            <label for="contactEmail">Email</label>
                            <input id="contactEmail" type="email" required>
                        </div>

                        <div class="field">
                            <label for="contactMessage">Message</label>
                            <textarea id="contactMessage" rows="5" required></textarea>
                        </div>

                        <button type="submit" class="btn">Submit</button>
                    </form>
                </section>

                <aside class="panel">
                    <h2>Get in touch</h2>
                    <p class="muted">
                        Email: hello@ascendingcloud.example<br>
                        Phone: +91 98765 43210<br>
                        Hours: Mon–Fri, 9:00 AM – 6:00 PM IST
                    </p>

                    <form onsubmit="subscribeNewsletter(event)">
                        <div class="field">
                            <label for="newsletterEmail">Subscribe to job alerts</label>
                            <input id="newsletterEmail" type="email" placeholder="you@example.com">
                        </div>
                        <button type="submit" class="btn light">Subscribe</button>
                    </form>
                </aside>
            </div>
        </div>
    </main>

    <div id="siteFooter"></div>

    <script src="main.js"></script>
</body>

</html>
