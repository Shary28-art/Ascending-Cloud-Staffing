<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Post cloud and technology job openings through the Ascending Cloud employer portal.">
    <title>Post a Job | Ascending Cloud Staffing</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body>
    <a class="skip-link" href="#mainContent">Skip to main content</a>

    <div id="siteNav"></div>

    <main id="mainContent" class="page">
        <div class="container">
            <div class="page-title">
                <div>
                    <h1>Post a Job</h1>
                    <p class="muted">Signed in as <span id="dashboardUserEmail"></span></p>
                </div>
                <button type="button" class="btn outline" onclick="logout()">Logout</button>
            </div>

            <div class="panel">
                <form id="postJobForm" onsubmit="submitJobForm(event)">
                    <div class="form-grid">
                        <div class="field">
                            <label for="jobTitle">Job Title</label>
                            <input id="jobTitle" type="text" required>
                        </div>

                        <div class="field">
                            <label for="jobCompany">Company</label>
                            <input id="jobCompany" type="text" required>
                        </div>

                        <div class="field">
                            <label for="jobLocation">Location</label>
                            <input id="jobLocation" type="text" required>
                        </div>

                        <div class="field">
                            <label for="jobPlatform">Cloud Platform</label>
                            <select id="jobPlatform" required>
                                <option value="AWS">AWS</option>
                                <option value="Azure">Azure</option>
                                <option value="GCP">GCP</option>
                            </select>
                        </div>

                        <div class="field">
                            <label for="jobType">Employment Type</label>
                            <select id="jobType" required>
                                <option value="Full-time">Full-time</option>
                                <option value="Contract">Contract</option>
                            </select>
                        </div>

                        <div class="field">
                            <label for="jobSalary">Salary Range</label>
                            <input id="jobSalary" type="text" placeholder="e.g. $4000" required>
                        </div>
                    </div>

                    <div class="field">
                        <label for="jobDescription">Job Description</label>
                        <textarea id="jobDescription" rows="6" required></textarea>
                    </div>

                    <button type="submit" class="btn">Save Draft</button>
                </form>
            </div>
        </div>
    </main>

    <div id="siteFooter"></div>

    <script>
        if (!localStorage.getItem("loggedIn")) {
            window.location.href = "../login.html";
        } else if (localStorage.getItem("userRole") !== "employer") {
            window.location.href = "../index.html";
        }
    </script>
    <script src="../main.js"></script>
</body>

</html>
