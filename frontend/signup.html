<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create your Ascending Cloud account to apply for jobs, save opportunities, and manage your profile.">
    <title>Create Account | Ascending Cloud Staffing</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <a class="skip-link" href="#mainContent">Skip to main content</a>

    <div id="siteNav"></div>

    <main id="mainContent" class="page">
        <div class="container">
            <div class="panel login-panel">
                <h1 class="login-title">Create Account</h1>
                <p class="muted">Join Ascending Cloud to explore opportunities and manage applications.</p>

                <div class="field">
                    <label for="name">Full Name</label>
                    <input id="name" type="text" placeholder="Your full name" autocomplete="name" required>
                </div>

                <div class="field">
                    <label for="email">Email</label>
                    <input id="email" type="email" placeholder="you@example.com" autocomplete="email" required>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input id="password" type="password" placeholder="Minimum 6 characters" autocomplete="new-password" required>
                </div>

                <div class="field">
                    <label for="role">Account Type</label>
                    <select id="role" aria-label="Account type">
                        <option value="candidate">Candidate</option>
                        <option value="employer">Employer</option>
                    </select>
                </div>

                <button class="btn login-button" type="button" onclick="signupUser()">Create Account</button>

                <p class="login-create">
                    Already have an account?
                    <a href="login.html">Login</a>
                </p>
            </div>
        </div>
    </main>

    <div id="siteFooter"></div>

    <script src="main.js"></script>
</body>

</html>
