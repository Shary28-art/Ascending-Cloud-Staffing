<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to your Ascending Cloud account to manage applications, saved jobs, and hiring requests.">
    <title>Login | Ascending Cloud Staffing</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <a class="skip-link" href="#mainContent">Skip to main content</a>

    <div id="siteNav"></div>

    <main id="mainContent" class="page">
        <div class="container">
            <div class="panel login-panel">
                <h1 class="login-title">Welcome Back</h1>
                <p class="muted">Login to your Ascending Cloud account.</p>

                <div class="field">
                    <label for="email">Email</label>
                    <input id="email" type="email" placeholder="you@example.com" autocomplete="email" required>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input id="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
                </div>

                <div class="field">
                    <label for="role">Account Type</label>
                    <select id="role" aria-label="Account type">
                        <option value="candidate">Candidate</option>
                        <option value="employer">Employer</option>
                        <option value="recruiter">Recruiter</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>

                <button class="btn login-button" type="button" onclick="loginUser()">Login</button>

                <p class="login-create">
                    Don't have an account?
                    <a href="signup.html">Create Account</a>
                </p>
            </div>
        </div>
    </main>

    <div id="siteFooter"></div>

    <script src="main.js"></script>
</body>

</html>
