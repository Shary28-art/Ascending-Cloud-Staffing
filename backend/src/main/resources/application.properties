spring.application.name=backend
server.port=8080

# ---------------------------------------------------------------------------
# Database. Secrets are NOT stored here.
#   - Local development: put them in application-local.properties (git-ignored)
#   - Staging/production: set environment variables
#       SPRING_DATASOURCE_PASSWORD, APP_JWT_SECRET, ...
# ---------------------------------------------------------------------------
spring.config.import=optional:classpath:application-local.properties,optional:file:./application-local.properties

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ascending_cloud_staffing?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}

# Schema is created with database/schema.sql (or upgrade_existing_db.sql) - Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.enabled=false

# ---------------------------------------------------------------------------
# JWT (app.jwt.secret must be 32+ characters; supply it via local file / env var)
# ---------------------------------------------------------------------------
app.jwt.expiration-ms=86400000

# ---------------------------------------------------------------------------
# CORS (comma separated list of front-end origins)
# ---------------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174}

# ---------------------------------------------------------------------------
# File uploads (resume max 5 MB, logo max 2 MB - enforced again in code)
# ---------------------------------------------------------------------------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Storage: "local" for development. Use a separate root per environment.
# Production should use S3 / Azure Blob via another StorageService implementation.
app.storage.type=local
app.storage.local-root=${STORAGE_ROOT:./uploads/dev}

management.endpoints.web.exposure.include=health
